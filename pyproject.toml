[project]
name = "news"
version = "0.1.0"
description = "Fetch categorized news with local article images."
requires-python = ">=3.15"
dependencies = [
    "beautifulsoup4>=4.14,<5",
    "feedparser>=6.0,<7",
    "googlenewsdecoder>=0.2.2",
    "httpx>=0.28,<1",
    "lxml>=6.0,<7",
    "markdownify>=1.2.3",
    "pillow>=13.0.0",
    "playwright>=1.50,<2",
    "requests>=2.32,<3",
    "trafilatura>=2.3.1",
    "tzdata>=2024.1",
    "wechat-article-parser>=0.0.17,<0.1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
