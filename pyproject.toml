[project]
name = "news"
version = "0.1.0"
description = "Fetch categorized news with local article images."
requires-python = ">=3.15"
dependencies = [
    "beautifulsoup4>=4.14,<5",
    "feedparser>=6.0,<7",
    "gnews>=0.6,<0.7",
    "httpx>=0.28,<1",
    "lxml>=6.0,<7",
    "playwright>=1.50,<2",
    "requests>=2.32,<3",
    "tzdata>=2024.1",
    "ua-generator>=2.1,<3",
    "wechat-article-parser>=0.0.17,<0.1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
