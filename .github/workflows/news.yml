name: Fetch latest news

on:
  # schedule:
  #   - cron: '*/30 8-20 * * *'
  #     timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: news-snapshot
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      UV_INDEX_URL: https://pypi.org/simple
      GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
      WECHAT_COOKIE: ${{ secrets.WECHAT_COOKIE }}
      WECHAT_PROXY: ${{ secrets.WECHAT_PROXY }}
      WECHAT_STORAGE_STATE: ${{ secrets.WECHAT_STORAGE_STATE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: astral-sh/setup-uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: '3.15'

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run --locked ruff format --check .
          uv run --locked ruff check .

      - name: Test
        run: uv run --locked python -m unittest discover -s tests

      - name: Install Chromium for JS-rendered articles
        run: uv run playwright install --with-deps chromium

      - name: Restore previous snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          # 上一轮快照与图片用于复用：未变化的条目不再回访原文、不再重下图片。
          if git fetch --depth=1 origin news 2>/dev/null; then
            git show origin/news:data/news.json > data/previous-news.json
            git archive origin/news data/images 2>/dev/null | tar -x -C .
          fi

      - name: Fetch news and download images
        run: uv run --locked fetch.py

      - name: Summarize run
        if: always()
        shell: bash
        run: |
          if [ -f data/report.json ]; then
            uv run --locked python -m newsfetch.report data/report.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish latest snapshot only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          tag="$(TZ=Asia/Shanghai date +%Y%m%d.%H%M)"
          snapshot_dir="$(mktemp -d)"
          cp -a data "$snapshot_dir/data"

          # 线上快照没有历史（孤儿分支 + force push），条数腰斩时宁可本轮不发布。
          previous=""
          if git fetch --depth=1 origin news 2>/dev/null; then
            previous="$(git show origin/news:data/news.json 2>/dev/null \
              | python3 -c 'import json,sys;print(json.load(sys.stdin)["count"])' 2>/dev/null \
              || true)"
          fi
          current="$(python3 -c 'import json;print(json.load(open("data/news.json"))["count"])')"
          if [ -n "$previous" ] && [ "$current" -lt $((previous / 2)) ]; then
            echo "本轮 ${current} 条不足上一轮 ${previous} 条的一半，放弃发布" >&2
            exit 1
          fi

          git checkout --orphan news
          git rm -rf .
          mkdir -p data
          cp -a "$snapshot_dir/data/." data/
          # previous-news.json 只是本轮的输入，不进产物分支。
          rm -f data/previous-news.json
          git add -f data
          git commit --allow-empty -m "News snapshot ${tag}"
          git push --force origin HEAD:news
          echo "Published ${tag} to news"

      - name: Delete old workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/news.yml/runs?per_page=100" \
            --jq '.workflow_runs[].id' |
            tail -n +11 |
            while read -r run_id; do
              gh run delete "$run_id"
            done
